site_name: Codelogium
site_description: Developer logs, notes, and learning paths
site_url: https://codelogium.github.io
repo_url: https://github.com/alfahami/codelogium.github.io
repo_name: alfahami/codelogium

theme:
  name: material
  language: en
  custom_dir: overrides
  favicon: assets/favicon.svg
  font: false
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: lucide/moon
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: lucide/sun
        name: Switch to light mode
  features:
    - navigation.top
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.indexes
    - content.tabs.link
    - content.code.copy
    - search.suggest
    - content.code.annotate
    - search.highlight

markdown_extensions:
  - toc:
      title: "Table of content"
      permalink: "¶"
      permalink_title: Permalink
      toc_depth: "1-6"
  - admonition
  - pymdownx.superfences
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.details
  - attr_list
  - tables


extra:
  pagetime: 'on'
  generator: false
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/alfahami
      name: alfahami on Github
    - icon: fontawesome/brands/linkedin
      link: https://www.linkedin.com/in/alfahami
      name: alfahami on LinkedIn
    - icon: fontawesome/brands/x-twitter
      link: https://x.com/al_fahami
      name: alfahami on X
  analytics:
    provider: google
    property: G-9L21ZFFY2J
    feedback:
      title: Was this page helpful?
      ratings:
        - icon: material/emoticon-happy-outline
          name: This page was helpful
          data: 1
          note: >-
            Thanks for your feedback!
        - icon: material/emoticon-sad-outline
          name: This page could be improved
          data: 0
          note: >-
            Thanks for your feedback! Help us improve this page by
            using our <a href="..." target="_blank" rel="noopener">feedback form</a>.

copyright: © 2026 <a href="https://codelogium.github.io/">Codelogium</a> • Crafted with curiosity accompanied by a cup of tea ☕

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - javascript/extra.js

plugins:
  - search:
  - awesome-nav:
  - blog:
      authors: true
  - tags
  # - social: can be installed later preferably in a linux machine
  - social:
      enabled: !ENV [CI, false]
